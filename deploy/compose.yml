# This service only. property-infra-postgres includes this file to compose the platform.

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BOOKING_URL: http://booking-api:3001
      # The worker's own service token (svc-worker), issued by Identity; in develop,
      # property-infra-postgres/scripts/dev-keys.sh writes it. Never versioned.
      SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?set WORKER_SERVICE_TOKEN}
    # It receives no requests: no port, not even expose.
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
